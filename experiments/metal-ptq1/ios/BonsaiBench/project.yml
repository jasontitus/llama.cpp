name: BonsaiBench
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  BonsaiBench:
    type: application
    platform: iOS
    configFiles:                  # team and bundle id; your own go in the gitignored Config/Local.xcconfig
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - BonsaiBench
      # llama.cpp's common speculative-decoding code (MTP), compiled into the app; it links against the
      # framework's llama API (BonsaiBench/MTP/BonsaiMTP.cpp drives it)
      - path: ../../../../common/common.cpp
        group: llama-common
      - path: ../../../../common/log.cpp
        group: llama-common
      - path: ../../../../common/fit.cpp
        group: llama-common
      - path: ../../../../common/reasoning-budget.cpp
        group: llama-common
      - path: ../../../../common/trie.cpp
        group: llama-common
      - path: ../../../../common/unicode.cpp
        group: llama-common
      - path: ../../../../common/ngram-cache.cpp
        group: llama-common
      - path: ../../../../common/ngram-map.cpp
        group: llama-common
      - path: ../../../../common/ngram-mod.cpp
        group: llama-common
      - path: ../../../../common/sampling.cpp
        group: llama-common
      - path: ../../../../common/speculative.cpp
        group: llama-common
    dependencies:
      - framework: ../../../../build-apple/llama.xcframework
        embed: true
    entitlements:
      path: BonsaiBench/BonsaiBench.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    info:
      path: BonsaiBench/Info.plist
      properties:
        CFBundleDisplayName: BonsaiBench
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    preBuildScripts:
      # The app compiles llama.cpp's common code (MTP) against include/ and ggml/include/ and links the
      # prebuilt framework: the public headers must match, or struct layouts differ at runtime.
      - name: Check framework matches the source
        basedOnDependencyAnalysis: false
        script: |
          ROOT="$SRCROOT/../../../.."
          FWH="$ROOT/build-apple/llama.xcframework/ios-arm64/llama.framework/Headers/llama.h"
          if [ ! -f "$FWH" ]; then
            echo "error: build-apple/llama.xcframework is missing: run ./build-xcframework.sh ios-device ios-sim in the repository root"; exit 1
          fi
          FWD="$(dirname "$FWH")"
          for h in llama.h ggml.h ggml-alloc.h ggml-backend.h ggml-cpu.h ggml-metal.h gguf.h; do
            SRCH="$ROOT/include/$h"; [ -f "$SRCH" ] || SRCH="$ROOT/ggml/include/$h"
            if ! cmp -s "$SRCH" "$FWD/$h"; then
              echo "error: llama.xcframework was built from a different $h than this checkout: rebuild it with ./build-xcframework.sh ios-device ios-sim"; exit 1
            fi
          done
    postBuildScripts:
      # Record what was built in BuildStamp.plist inside the app; every result JSON carries it (BuildInfo):
      # the app's source revision and uncommitted app files, the source the framework was built from (written
      # by build-xcframework.sh), and the SHA-256 of the framework binary before it is signed into the app.
      - name: Stamp build
        basedOnDependencyAnalysis: false
        script: |
          ROOT="$SRCROOT/../../../.."
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BuildStamp.plist"
          REV=$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || echo unknown)
          APPDIRTY=$(git -C "$ROOT" status --porcelain -- experiments/metal-ptq1/ios common 2>/dev/null | wc -l | tr -d ' ')
          SRC="$ROOT/build-apple/llama.xcframework.source"
          FWREV=$(sed -n 's/^revision=//p' "$SRC" 2>/dev/null); FWREV=${FWREV:-unknown}
          FWDIRTY=$(sed -n 's/^dirty_files=//p' "$SRC" 2>/dev/null); FWDIRTY=${FWDIRTY:-unknown}
          FW=$(shasum -a 256 "$ROOT/build-apple/llama.xcframework/ios-arm64/llama.framework/llama" | cut -d' ' -f1)
          rm -f "$OUT"
          /usr/libexec/PlistBuddy -c "Add :BBSourceRevision string $REV" -c "Add :BBAppDirtyFiles string $APPDIRTY" \
            -c "Add :BBFrameworkRevision string $FWREV" -c "Add :BBFrameworkDirtyFiles string $FWDIRTY" \
            -c "Add :BBFrameworkSHA256 string $FW" "$OUT"
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: BonsaiBench/BonsaiBench-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../../../../include
          - $(SRCROOT)/../../../../ggml/include
          - $(SRCROOT)/../../../../common
          - $(SRCROOT)/../../../../src
          - $(SRCROOT)/../../../../vendor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Release:
          GCC_PREPROCESSOR_DEFINITIONS: ["NDEBUG=1"]
schemes:
  BonsaiBench:
    build:
      targets:
        BonsaiBench: all
    # Benchmarks must not run under the debugger, Metal API validation or frame capture: build Release,
    # install, and launch from the home screen (or with devicectl).
    run:
      config: Release
      debugEnabled: false
      enableGPUFrameCaptureMode: disabled
      enableGPUValidationMode: disabled
    archive:
      config: Release
