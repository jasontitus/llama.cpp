name: BonsaiBench
options:
  bundleIdPrefix: dev.bonsaibench
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your team in Xcode (Signing & Capabilities) to install on a device
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  BonsaiBench:
    type: application
    platform: iOS
    sources:
      - BonsaiBench
    dependencies:
      - framework: ../../../../build-apple/llama.xcframework
        embed: true
    entitlements:
      path: BonsaiBench/BonsaiBench.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    info:
      path: BonsaiBench/Info.plist
      properties:
        CFBundleDisplayName: BonsaiBench
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bonsaibench.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
